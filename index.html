<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Remoto - Movilnet IoT</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background-color: #121212; color: white; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 10px; margin: 10px; font-weight: bold; }
        .on { background-color: #28a745; color: white; border: none; }
        .off { background-color: #dc3545; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Control Generador Movilnet</h1>
    <button class="on" onclick="controlarRele('ON')">ENCENDER</button>
    <button class="off" onclick="controlarRele('OFF')">APAGAR</button>

    <script>
        const username = "hectorasj";
        const key = "aio_WlDd22yXwK1FkYdeuq1WOB2K8CcF";
        const feed = "rele";

        function controlarRele(estado) {
            fetch(`https://io.adafruit.com/api/v2/${username}/feeds/${feed}/data`, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ "value": estado })
            })
            .then(response => {
                if (response.ok) {
                    alert("¡Éxito! Orden enviada: " + estado);
                } else {
                    response.text().then(text => alert("Error " + response.status + ": " + text));
                }
            })
            .catch(err => console.error("Error de red:", err));
        }
    </script>
</body>
</html>
