<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Remoto - Movilnet IoT</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background-color: #121212; color: white; }
        button { padding: 25px 50px; font-size: 22px; cursor: pointer; border-radius: 12px; margin: 15px; font-weight: bold; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); }
        .on { background-color: #28a745; color: white; border: none; }
        .off { background-color: #dc3545; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Control Generador Movilnet</h1>
    <p>Panel de Pasantías - Telemetría</p>
    
    <button class="on" onclick="controlarRele('ON')">ENCENDER MOTOR</button><br>
    <button class="off" onclick="controlarRele('OFF')">APAGAR MOTOR</button>

    <script>
        const username = "hectorasj";
        const key = "aio_VBzU56NqzC2Br7d0suOuoxA8f9Uz";
        const feed = "rele";

        function controlarRele(estado) {
            fetch(`https://io.adafruit.com/api/v2/${username}/feeds/${feed}/data`, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ "value": estado })
            })
            .then(response => {
                if (response.ok) {
                    alert("Comando enviado exitosamente: " + estado);
                } else {
                    response.text().then(text => alert("Error al enviar: " + text));
                }
            })
            .catch(err => console.error("Error de red:", err));
        }
    </script>
</body>
</html>
